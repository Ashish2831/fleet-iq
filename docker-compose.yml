services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetiq
      POSTGRES_PASSWORD: fleetiq
      POSTGRES_DB: fleetiq
    ports:
      - "5434:5432"
    volumes:
      - fleetiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:8081"
      - "18082:8082"
    volumes:
      - fleetiq_redpanda:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
    ports:
      - "8088:8080"
    depends_on:
      - redpanda

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - fleetiq_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9201:9200"
    volumes:
      - fleetiq_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  core:
    profiles: ["dist"]
    build: .
    environment: &django_db
      FLEETIQ_ROLE: core
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetiq
      POSTGRES_USER: fleetiq
      POSTGRES_PASSWORD: fleetiq
      JWT_SECRET: dev-only-change-me-please-use-32b+
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8000:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi_core:application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tracking:
    profiles: ["dist"]
    build: .
    environment:
      <<: *django_db
      FLEETIQ_ROLE: tracking
      MONGO_URI: mongodb://mongo:27017
      MONGO_ENABLED: "true"
    ports:
      - "8001:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi_tracking:application
    depends_on:
      - postgres
      - redis
      - mongo

  ai:
    profiles: ["dist"]
    build: .
    environment:
      <<: *django_db
      FLEETIQ_ROLE: ai
      CORE_API_URL: http://core:8000
    ports:
      - "8002:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi_core:application
    depends_on:
      - postgres

  analytics:
    profiles: ["dist"]
    build: .
    environment:
      <<: *django_db
      FLEETIQ_ROLE: analytics
    ports:
      - "8003:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi_core:application
    depends_on:
      - postgres

  gateway:
    profiles: ["dist"]
    build: .
    environment:
      <<: *django_db
      FLEETIQ_ROLE: gateway
      GATEWAY_HTTP: "true"
      CORE_GRAPHQL_URL: http://core:8000/graphql
      TRACKING_GRAPHQL_URL: http://tracking:8000/graphql
      AI_GRAPHQL_URL: http://ai:8000/graphql
      ANALYTICS_GRAPHQL_URL: http://analytics:8000/graphql
    ports:
      - "4000:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi_core:application
    depends_on:
      - core
      - tracking
      - ai
      - analytics

  shell:
    profiles: ["dist"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_TRACKING_WS: ws://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  fleetiq_pgdata:
  fleetiq_redpanda:
  fleetiq_mongo:
  fleetiq_es:
  web_node_modules:
